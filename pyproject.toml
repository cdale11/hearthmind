[project]
name = "hearthmind"
version = "1.34.26"
description = "A persistent, always-running artificial world — a town in a box."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = []
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
hearthmind-server = "hearthmind.server:main"
hearthmind-inspect = "hearthmind.inspect_world:main"
hearthmind-experiment = "hearthmind.experiment:main"

[build-system]
# setuptools>=77 for the SPDX-string `project.license` form above
# (older setuptools rejects it outright rather than just warning — see
# docs/DECISIONS.md, "pyproject.toml license field" fix). `pip install
# -e .` resolves this automatically via build isolation; a direct
# `python3 setup.py build_ext --inplace` invocation needs a matching
# setuptools already installed in the active environment.
requires = ["setuptools>=77", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearthmind*"]

[tool.setuptools.package-data]
"hearthmind.interface" = ["static/*"]
