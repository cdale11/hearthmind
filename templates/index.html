<!doctype html><html><head><title>Hearthmind</title></head>
<body style='background:#1b1b1b;color:#ddd;font-family:sans-serif'>
<h1>🔥 Hearthmind</h1>
<p>A world that never waits for you.</p>
<div id='stats'></div>
<script>
async function upd(){
let r=await fetch('/api/status');let j=await r.json();
document.getElementById('stats').innerHTML=
`Tick: ${j.tick}<br>Day: ${j.day}<br>Hour: ${j.hour}:00<br>Season: ${j.season}`;
}
upd();setInterval(upd,1000);
</script></body></html>
