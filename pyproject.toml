[project]
name = "hearthmind"
version = "1.34.291"
description = "A persistent, always-running artificial world — a town in a box."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = []
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Tier 5 A1.1: HearthBench's own dependency set, kept separate so a
# bench-only dependency can never enter the live sim's runtime path
# (`pip install -e .[bench]`). A12's daemon needs a real HTTP server —
# the same fastapi/uvicorn versions the `api` extra already pins, kept
# as a SEPARATE extra (not a shared dependency) so `pip install -e .`
# alone still installs neither, and a live sim deployment never needs
# `bench` just because its own `api` extra happens to want the same
# packages.
bench = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Tier 6 (docs/ML-ARCHITECTURE-2026-08-01.md, L0 substrate): offline
# training only, never a runtime/inference dependency — inference
# always runs the stdlib-only pure-Python fallback or the C++ path.
# `pip install -e .[ml]` to train; the live server never needs this.
ml = ["numpy>=1.26"]
# v1.34.173, explicit user directive: deep-learning frameworks are now
# also permitted, kept in their OWN extras (not folded into `ml`) so a
# numpy-only training pass never pulls a multi-GB framework it doesn't
# need. Still offline-training-only, same as `ml` — no model consumed
# at runtime may depend on either. Neither is installed/exercised by
# this repo yet; a future model that genuinely needs one (larger than
# L0's small MLP primitives can comfortably express) installs the
# matching extra when it's actually built, not speculatively now.
ml-torch = ["torch>=2.2"]
ml-tensorflow = ["tensorflow>=2.15"]

[project.scripts]
hearthmind-server = "hearthmind.server:main"
hearthmind-inspect = "hearthmind.inspect_world:main"
hearthmind-experiment = "hearthmind.experiment:main"

[build-system]
# setuptools>=77 for the SPDX-string `project.license` form above
# (older setuptools rejects it outright rather than just warning — see
# docs/DECISIONS.md, "pyproject.toml license field" fix). `pip install
# -e .` resolves this automatically via build isolation; a direct
# `python3 setup.py build_ext --inplace` invocation needs a matching
# setuptools already installed in the active environment.
requires = ["setuptools>=77", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearthmind*", "hearthbench*"]

[tool.setuptools.package-data]
"hearthmind.interface" = ["static/*"]
