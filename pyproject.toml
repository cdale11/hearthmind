[project]
name = "hearthmind"
version = "0.39.0"
description = "A persistent, always-running artificial world — a town in a box."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = []
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
hearthmind-server = "hearthmind.server:main"
hearthmind-inspect = "hearthmind.inspect_world:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearthmind*"]

[tool.setuptools.package-data]
"hearthmind.interface" = ["static/*"]
